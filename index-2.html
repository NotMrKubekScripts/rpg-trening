<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GRIND.SYS // Dziennik Treningowy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212;
    --bg-panel:#1a1a1d;
    --bg-panel-alt:#202024;
    --border:#2e2e33;
    --neon-violet:#b026ff;
    --neon-violet-soft:rgba(176,38,255,.4);
    --neon-green:#39ff14;
    --neon-green-soft:rgba(57,255,20,.35);
    --text:#e7e7ec;
    --text-dim:#87878f;
    --danger:#ff3b5c;
    --font-display:'Orbitron',sans-serif;
    --font-body:'Rajdhani',sans-serif;
    --font-mono:'Share Tech Mono',monospace;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background:var(--bg);
  }

  body{
    font-family:var(--font-body);
    color:var(--text);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  /* subtelny szum / winieta tła */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at 50% 0%, rgba(176,38,255,.08), transparent 60%),
      radial-gradient(circle at 100% 100%, rgba(57,255,20,.05), transparent 55%);
    pointer-events:none;
    z-index:0;
  }

  .app-shell{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    z-index:1;
    border-left:1px solid var(--border);
    border-right:1px solid var(--border);
    box-shadow:0 0 60px rgba(176,38,255,.06);
    display:flex;
    flex-direction:column;
  }

  @media (min-width:520px){
    body{ padding:32px 16px; }
    .app-shell{
      min-height:auto;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 0 0 1px var(--border), 0 30px 80px rgba(0,0,0,.6), 0 0 80px rgba(176,38,255,.08);
    }
  }

  /* pasek skanowania na górze */
  .scanline{
    position:absolute;
    left:0; right:0; top:0;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--neon-violet), transparent);
    animation:scan 4s linear infinite;
    opacity:.6;
    z-index:5;
  }
  @keyframes scan{
    0%{ transform:translateY(0); opacity:0; }
    10%{ opacity:.7; }
    90%{ opacity:.7; }
    100%{ transform:translateY(600px); opacity:0; }
  }

  /* ===== TOPBAR ===== */
  .topbar{
    padding:14px 18px 6px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:1px;
    color:var(--text-dim);
  }
  .topbar .prompt{ color:var(--neon-green); }
  .topbar .prompt::after{
    content:"_";
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ===== HERO / PANEL BOHATERA ===== */
  .hero{
    margin:10px 16px 18px;
    padding:18px 18px 20px;
    background:linear-gradient(160deg, var(--bg-panel), var(--bg-panel-alt));
    border:1px solid var(--border);
    clip-path:polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    position:relative;
  }
  .hero::after{
    content:"";
    position:absolute; inset:0;
    clip-path:polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    box-shadow:inset 0 0 0 1px rgba(176,38,255,.15);
    pointer-events:none;
  }

  .hero-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }

  .player-id{ flex:1; min-width:0; }
  .player-label{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--text-dim);
    letter-spacing:2px;
    text-transform:uppercase;
  }
  .player-name{
    font-family:var(--font-display);
    font-size:18px;
    font-weight:800;
    color:var(--text);
    background:transparent;
    border:none;
    outline:none;
    width:100%;
    padding:4px 0 0;
    letter-spacing:.5px;
  }
  .player-name:focus{ color:var(--neon-green); }

  .level-badge{
    flex-shrink:0;
    font-family:var(--font-display);
    text-align:center;
    background:rgba(176,38,255,.12);
    border:1px solid var(--neon-violet-soft);
    padding:6px 12px;
    clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);
  }
  .level-badge .lv-label{
    font-size:9px;
    letter-spacing:2px;
    color:var(--neon-violet);
    display:block;
  }
  .level-badge .lv-value{
    font-size:22px;
    font-weight:900;
    color:var(--text);
    line-height:1.1;
  }

  .xp-wrap{ margin-top:16px; }
  .xp-labels{
    display:flex;
    justify-content:space-between;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .xp-labels span#xpText{ color:var(--neon-violet); }

  .xp-track{
    height:14px;
    background:#0b0b0d;
    border:1px solid var(--border);
    position:relative;
    clip-path:polygon(7px 0,100% 0,100% 100%,0 100%,0 7px);
    overflow:hidden;
  }
  .xp-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, #6a0fb8, var(--neon-violet) 70%, #e2a3ff);
    box-shadow:0 0 12px var(--neon-violet-soft), 0 0 2px var(--neon-violet) inset;
    transition:width .5s cubic-bezier(.4,0,.2,1);
    position:relative;
  }
  .xp-fill::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
    width:40px;
    animation:shimmer 2.2s linear infinite;
  }
  @keyframes shimmer{
    0%{ transform:translateX(-60px); }
    100%{ transform:translateX(220px); }
  }

  .stats-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:16px;
  }
  .stat-chip{
    background:#0e0e10;
    border:1px solid var(--border);
    padding:8px 6px;
    text-align:center;
    clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px);
  }
  .stat-chip .stat-label{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:2px;
    color:var(--neon-green);
  }
  .stat-chip .stat-value{
    font-family:var(--font-display);
    font-size:19px;
    font-weight:800;
    margin-top:2px;
  }

  /* ===== SEKCJA ZADAŃ ===== */
  .section-title{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin:4px 18px 10px;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:2px;
    color:var(--text-dim);
    text-transform:uppercase;
  }
  .section-title .count{ color:var(--neon-green); }

  .task-list{
    padding:0 16px 20px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .task-card{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    background:var(--bg-panel);
    border:1px solid var(--border);
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    transition:border-color .25s, opacity .25s;
  }
  .task-card .icon{
    font-size:22px;
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0e0e10;
    border:1px solid var(--border);
    flex-shrink:0;
  }
  .task-info{ flex:1; min-width:0; }
  .task-name{
    font-family:var(--font-display);
    font-size:13px;
    font-weight:700;
    letter-spacing:.3px;
  }
  .task-amount{
    font-family:var(--font-mono);
    font-size:11px;
    font-weight:400;
    color:var(--neon-green);
    letter-spacing:.5px;
  }
  .task-quest{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-dim);
    margin-top:2px;
  }
  .task-xp{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--neon-violet);
    margin-top:3px;
  }

  .btn-complete{
    flex-shrink:0;
    font-family:var(--font-display);
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
    color:#0d1a00;
    background:var(--neon-green);
    border:none;
    padding:10px 12px;
    cursor:pointer;
    clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px);
    box-shadow:0 0 14px var(--neon-green-soft);
    transition:transform .15s, filter .15s;
  }
  .btn-complete:active{ transform:scale(.94); }
  .btn-complete:hover{ filter:brightness(1.12); }

  .task-card.done{
    opacity:.5;
    border-color:var(--border);
  }
  .task-card.done .btn-complete{
    background:transparent;
    color:var(--text-dim);
    box-shadow:none;
    border:1px solid var(--border);
    cursor:default;
  }
  .task-card.done .icon{ filter:grayscale(1); }

  .task-card.pulse{
    animation:pulseCard .5s ease;
  }
  @keyframes pulseCard{
    0%{ box-shadow:0 0 0 rgba(57,255,20,0); }
    30%{ box-shadow:0 0 18px rgba(57,255,20,.5); }
    100%{ box-shadow:0 0 0 rgba(57,255,20,0); }
  }

  /* ===== FOOTER ===== */
  .footer{
    margin-top:auto;
    padding:14px 16px 22px;
    text-align:center;
  }
  .reset-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:1px;
    padding:8px 14px;
    cursor:pointer;
    clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px);
  }
  .reset-btn:hover{ color:var(--danger); border-color:var(--danger); }

  /* ===== LEVEL UP MODAL ===== */
  .levelup-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s;
  }
  .levelup-overlay.show{
    opacity:1;
    pointer-events:auto;
  }
  .levelup-card{
    width:min(320px, 84vw);
    background:linear-gradient(160deg, var(--bg-panel), #14060f);
    border:1px solid var(--neon-violet-soft);
    padding:26px 22px;
    text-align:center;
    clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
    box-shadow:0 0 50px rgba(176,38,255,.35);
    transform:scale(.85);
    transition:transform .3s;
  }
  .levelup-overlay.show .levelup-card{ transform:scale(1); }
  .levelup-eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:3px;
    color:var(--neon-green);
  }
  .levelup-title{
    font-family:var(--font-display);
    font-size:30px;
    font-weight:900;
    margin:8px 0;
    color:var(--text);
    text-shadow:0 0 18px var(--neon-violet-soft);
    animation:glitch 1.2s steps(2,end) 2;
  }
  @keyframes glitch{
    0%,100%{ transform:translate(0,0); }
    20%{ transform:translate(-2px,1px); }
    40%{ transform:translate(2px,-1px); }
    60%{ transform:translate(-1px,0); }
    80%{ transform:translate(1px,1px); }
  }
  .levelup-stat{
    font-family:var(--font-body);
    font-size:14px;
    color:var(--text-dim);
    margin-bottom:18px;
  }
  .levelup-stat b{ color:var(--neon-green); }
  .levelup-close{
    font-family:var(--font-display);
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
    background:var(--neon-violet);
    color:#fff;
    border:none;
    padding:10px 22px;
    cursor:pointer;
    clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);
    box-shadow:0 0 16px var(--neon-violet-soft);
  }
</style>
</head>
<body>

  <div class="app-shell" id="appShell">
    <div class="scanline"></div>

    <div class="topbar">
      <span><span class="prompt">&gt;</span> grind.sys</span>
      <span id="todayLabel">--/--</span>
    </div>

    <!-- PANEL BOHATERA -->
    <section class="hero">
      <div class="hero-top">
        <div class="player-id">
          <div class="player-label">Jednostka</div>
          <input class="player-name" id="playerName" maxlength="18" spellcheck="false" value="Wojownik">
        </div>
        <div class="level-badge">
          <span class="lv-label">LVL</span>
          <span class="lv-value" id="levelValue">1</span>
        </div>
      </div>

      <div class="xp-wrap">
        <div class="xp-labels">
          <span>DOŚWIADCZENIE</span>
          <span id="xpText">0 / 100</span>
        </div>
        <div class="xp-track">
          <div class="xp-fill" id="xpFill"></div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-chip">
          <div class="stat-label">STR</div>
          <div class="stat-value" id="statSTR">5</div>
        </div>
        <div class="stat-chip">
          <div class="stat-label">STA</div>
          <div class="stat-value" id="statSTA">5</div>
        </div>
        <div class="stat-chip">
          <div class="stat-label">DEX</div>
          <div class="stat-value" id="statDEX">5</div>
        </div>
      </div>
    </section>

    <div class="section-title">
      <span>Zadania Dnia</span>
      <span><span class="count" id="doneCount">0</span>/<span id="totalCount">4</span> ukończone</span>
    </div>

    <!-- LISTA ZADAŃ -->
    <div class="task-list" id="taskList">
      <!-- generowane przez JS -->
    </div>

    <div class="footer">
      <button class="reset-btn" id="resetBtn">⟲ Resetuj cały postęp</button>
    </div>
  </div>

  <!-- LEVEL UP MODAL -->
  <div class="levelup-overlay" id="levelUpOverlay">
    <div class="levelup-card">
      <div class="levelup-eyebrow">AWANS POZIOMU</div>
      <div class="levelup-title" id="levelUpTitle">LVL 2</div>
      <div class="levelup-stat" id="levelUpStatText">Statystyka <b>STR</b> wzrosła o +1!</div>
      <button class="levelup-close" id="levelUpClose">KONTYNUUJ</button>
    </div>
  </div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "grindSys.state.v1";
  const XP_PER_TASK = 15;
  const STAT_KEYS = ["STR","STA","DEX"];

  const TASKS = [
    { id:"pushups", icon:"💪", name:"Pompki",    target:"20 powtórzeń", quest:"Trening Siłowy"      },
    { id:"squats",  icon:"🦵", name:"Przysiady", target:"25 powtórzeń", quest:"Fundament Mocy"      },
    { id:"situps",  icon:"🔥", name:"Brzuszki",  target:"20 powtórzeń", quest:"Rdzeń Wojownika"     },
    { id:"run",     icon:"🏃", name:"Bieganie",  target:"2 km",         quest:"Wytrzymałość Łowcy"  }
  ];

  function todayKey(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  function todayLabel(){
    const d = new Date();
    return String(d.getDate()).padStart(2,"0") + "." + String(d.getMonth()+1).padStart(2,"0");
  }

  function defaultState(){
    return {
      playerName: "Wojownik",
      level: 1,
      xp: 0,
      xpToNext: 100,
      stats: { STR:5, STA:5, DEX:5 },
      lastResetDate: todayKey(),
      completedTasks: []
    };
  }

  function loadState(){
    let s;
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      s = raw ? JSON.parse(raw) : defaultState();
    }catch(e){
      s = defaultState();
    }
    // uzupełnij brakujące pola (na wypadek starszej wersji zapisu)
    const d = defaultState();
    s = Object.assign({}, d, s);
    s.stats = Object.assign({}, d.stats, s.stats || {});

    // codzienny reset listy wykonanych zadań
    const today = todayKey();
    if(s.lastResetDate !== today){
      s.completedTasks = [];
      s.lastResetDate = today;
    }
    return s;
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){ /* localStorage niedostępny - kontynuuj bez zapisu */ }
  }

  let state = loadState();
  let levelUpQueue = [];

  // ==== RENDEROWANIE ====

  function render(){
    document.getElementById("todayLabel").textContent = todayLabel();
    document.getElementById("playerName").value = state.playerName;
    document.getElementById("levelValue").textContent = state.level;
    document.getElementById("xpText").textContent = state.xp + " / " + state.xpToNext;
    document.getElementById("xpFill").style.width = Math.min(100, (state.xp/state.xpToNext)*100) + "%";

    STAT_KEYS.forEach(function(k){
      document.getElementById("stat"+k).textContent = state.stats[k];
    });

    renderTasks();
  }

  function renderTasks(){
    const list = document.getElementById("taskList");
    list.innerHTML = "";

    TASKS.forEach(function(task){
      const done = state.completedTasks.indexOf(task.id) !== -1;

      const card = document.createElement("div");
      card.className = "task-card" + (done ? " done" : "");
      card.dataset.taskId = task.id;

      card.innerHTML =
        '<div class="icon">' + task.icon + '</div>' +
        '<div class="task-info">' +
          '<div class="task-name">' + task.name + ' <span class="task-amount">&times; ' + task.target + '</span></div>' +
          '<div class="task-quest">' + task.quest + '</div>' +
          '<div class="task-xp">+' + XP_PER_TASK + ' XP</div>' +
        '</div>' +
        '<button class="btn-complete" type="button">' + (done ? "Ukończono ✓" : "Wykonane") + '</button>';

      const btn = card.querySelector(".btn-complete");
      btn.addEventListener("click", function(){ completeTask(task.id, card); });

      list.appendChild(card);
    });

    const doneCount = state.completedTasks.length;
    document.getElementById("doneCount").textContent = doneCount;
    document.getElementById("totalCount").textContent = TASKS.length;
  }

  // ==== MECHANIKA GRY ====

  function completeTask(taskId, cardEl){
    if(state.completedTasks.indexOf(taskId) !== -1) return;

    state.completedTasks.push(taskId);
    state.xp += XP_PER_TASK;

    checkLevelUps();
    saveState();
    render();

    // znajdź świeżo wyrenderowaną kartę i dodaj puls
    const freshCard = document.querySelector('.task-card[data-task-id="'+taskId+'"]');
    if(freshCard){
      freshCard.classList.add("pulse");
      setTimeout(function(){ freshCard.classList.remove("pulse"); }, 500);
    }

    if(levelUpQueue.length > 0){
      showNextLevelUp();
    }
  }

  function checkLevelUps(){
    while(state.xp >= state.xpToNext){
      state.xp -= state.xpToNext;
      state.level += 1;
      state.xpToNext = Math.round(state.xpToNext * 1.2);

      const statKey = STAT_KEYS[Math.floor(Math.random() * STAT_KEYS.length)];
      state.stats[statKey] += 1;

      levelUpQueue.push({ level: state.level, stat: statKey });
    }
  }

  function showNextLevelUp(){
    const evt = levelUpQueue.shift();
    if(!evt) return;

    document.getElementById("levelUpTitle").textContent = "LVL " + evt.level;
    document.getElementById("levelUpStatText").innerHTML =
      "Statystyka <b>" + evt.stat + "</b> wzrosła o +1!";

    const overlay = document.getElementById("levelUpOverlay");
    overlay.classList.add("show");

    // wymuś ponowne odtworzenie animacji glitch przy kolejnych awansach
    const titleEl = document.getElementById("levelUpTitle");
    titleEl.style.animation = "none";
    void titleEl.offsetWidth;
    titleEl.style.animation = "";
  }

  document.getElementById("levelUpClose").addEventListener("click", function(){
    document.getElementById("levelUpOverlay").classList.remove("show");
    if(levelUpQueue.length > 0){
      setTimeout(showNextLevelUp, 250);
    }
  });

  // ==== NAZWA GRACZA ====

  const nameInput = document.getElementById("playerName");
  nameInput.addEventListener("input", function(){
    state.playerName = nameInput.value.slice(0,18);
    saveState();
  });
  nameInput.addEventListener("blur", function(){
    if(nameInput.value.trim() === ""){
      nameInput.value = "Wojownik";
      state.playerName = "Wojownik";
      saveState();
    }
  });

  // ==== RESET ====

  document.getElementById("resetBtn").addEventListener("click", function(){
    const ok = confirm("Czy na pewno chcesz zresetować cały postęp? Poziom, XP i statystyki wrócą do stanu początkowego.");
    if(!ok) return;
    localStorage.removeItem(STORAGE_KEY);
    state = defaultState();
    levelUpQueue = [];
    saveState();
    render();
  });

  // ==== START ====
  try{
    render();
  }catch(err){
    const list = document.getElementById("taskList");
    if(list){
      list.innerHTML = '<div style="color:#ff3b5c;font-family:\'Share Tech Mono\',monospace;font-size:12px;line-height:1.5;padding:14px;border:1px solid #ff3b5c;">'
        + '⚠ Błąd renderowania zadań:<br>' + (err && err.message ? err.message : String(err)) + '</div>';
    }
    if(window.console && console.error) console.error(err);
  }

})();
</script>
</body>
</html>
